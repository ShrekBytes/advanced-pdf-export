name: Release Obsidian Plugin

on:
  push:
    branches:
      - main
    paths:
      - manifest.json

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the generator needs the last tag to diff from,
      # and a shallow clone cannot see one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version change
        id: version
        run: |
          OLD_VERSION=$(git show HEAD^:manifest.json | jq -r '.version')
          NEW_VERSION=$(jq -r '.version' manifest.json)
          echo "old=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged ($NEW_VERSION), skipping release."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $OLD_VERSION → $NEW_VERSION"
          fi

      - name: Set up Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      # Writes this release's entry into src/changelog.json from the commits
      # since the last tag, so the notes in the bundle match the release they
      # ship with. Must run before the build.
      - name: Generate release notes
        if: steps.version.outputs.changed == 'true'
        run: node scripts/generate-changelog.mjs

      - name: Build plugin
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Generate artifact attestations
        if: steps.version.outputs.changed == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            main.js \
            manifest.json \
            styles.css

      # Keeps main in step with what shipped. Touches only changelog.json, so
      # it cannot re-trigger this workflow, which filters on manifest.json.
      # checkout leaves a detached HEAD on a push event, so this pushes an
      # explicit refspec rather than pulling — there is no upstream to rebase.
      - name: Commit generated release notes
        if: steps.version.outputs.changed == 'true'
        run: |
          if git diff --quiet -- src/changelog.json; then
            echo "No change to src/changelog.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/changelog.json
          git commit -m "chore: release notes for ${{ steps.version.outputs.new }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed release notes."
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto main."
            git fetch origin main
            git rebase FETCH_HEAD
          done
          echo "Could not push the generated release notes after 3 attempts."
          exit 1
